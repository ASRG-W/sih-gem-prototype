<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeM-AuditAI Verification Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gemDark: '#0f172a', gemCard: '#1e293b' } } }
        }
    </script>
</head>
<body class="bg-gemDark text-gray-200 font-sans p-6 min-h-screen">

    <!-- Header -->
    <header class="mb-8 border-b border-gray-700 pb-4">
        <h1 class="text-3xl font-bold text-white tracking-tight">GeM-AuditAI <span class="text-blue-500 text-lg ml-2">Twin-Schema Verification</span></h1>
        <p class="text-gray-400 text-sm mt-1">SIH Problem Statement 26100 | Team DevSync</p>
    </header>

    <!-- DEMO INPUT SECTION (For Judges) -->
    <section class="mb-8 bg-gemCard p-4 rounded-lg border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-white">⚙️ Demo Configuration (Mock API Input)</h2>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">UPLOADED PDF DATA (JSON)</label>
                <textarea id="input-pdf" class="w-full h-32 bg-gray-900 border border-gray-600 text-green-400 font-mono text-sm p-2 rounded"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">GOVERNMENT API TRUTH (JSON)</label>
                <textarea id="input-api" class="w-full h-32 bg-gray-900 border border-gray-600 text-blue-400 font-mono text-sm p-2 rounded"></textarea>
            </div>
        </div>
        <button onclick="loadData()" class="mt-4 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition">Load Demo Data</button>
    </section>

    <!-- DASHBOARD SECTION -->
    <main id="dashboard" class="hidden">
        
        <!-- Summary Banner -->
        <div id="summary-banner" class="hidden mb-6 p-4 rounded-lg border border-red-500 bg-red-900/30 flex justify-between items-center">
            <div>
                <h3 class="text-red-400 font-bold text-lg">⚠️ VERIFICATION FAILED</h3>
                <p class="text-gray-300 text-sm mt-1">Confidence: 94% | Discrepancies: 1 Fatal, 1 Warning, 1 Missing Data</p>
            </div>
            <div class="space-x-3">
                <button onclick="logDecision('Accepted')" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded border border-green-400 transition shadow-[0_0_10px_rgba(34,197,94,0.3)]">Accept Profile</button>
                <button onclick="logDecision('Rejected')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded border border-red-400 transition shadow-[0_0_10px_rgba(239,68,68,0.3)]">Reject Profile</button>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-white">Live Audit Trail</h2>
            <button id="audit-btn" onclick="runAudit()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded border border-blue-400 transition shadow-[0_0_15px_rgba(59,130,246,0.4)]">Run AI Audit</button>
        </div>

        <!-- Side by Side Viewer -->
        <div class="grid grid-cols-2 gap-6">
            <!-- Left: PDF -->
            <div class="bg-gemCard rounded-lg p-5 border border-gray-700 shadow-lg">
                <h3 class="text-gray-400 font-bold mb-4 border-b border-gray-700 pb-2">📄 Extracted PDF Claim (Vendor)</h3>
                <div id="pdf-fields" class="space-y-4"></div>
            </div>
            
            <!-- Right: API -->
            <div class="bg-gemCard rounded-lg p-5 border border-gray-700 shadow-lg">
                <h3 class="text-gray-400 font-bold mb-4 border-b border-gray-700 pb-2">🏛️ API Ground Truth (Govt)</h3>
                <div id="api-fields" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        // Default Demo Data - Personalized & Trapped!
        const defaultPDF = {
            "Vendor_Name": "Aayush Singh Rajput - DevSync",
            "PAN_Number": "ABCDE1234F",
            "Registered_Address": "Plt 42, Ph 1, Ind. Area, New Delhi 110020",
            "Annual_Turnover_INR": "12000000",
            "MSME_Status": "Micro Enterprise"
        };
        const defaultAPI = {
            "Vendor_Name": "Aayush S. Rajput - DevSync",
            "PAN_Number": "ABCDE1234F",
            "Registered_Address": "Plot 42, Phase 1, Industrial Area, New Delhi 110020",
            "Annual_Turnover_INR": "1200000",
            "MSME_Status": "" // The "Missing Data" Trap
        };

        // Initialize Textareas
        document.getElementById('input-pdf').value = JSON.stringify(defaultPDF, null, 2);
        document.getElementById('input-api').value = JSON.stringify(defaultAPI, null, 2);

        let currentPDF = {};
        let currentAPI = {};
        let auditComplete = false;

        function loadData() {
            try {
                currentPDF = JSON.parse(document.getElementById('input-pdf').value);
                currentAPI = JSON.parse(document.getElementById('input-api').value);
                auditComplete = false;
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('summary-banner').classList.add('hidden');
                document.getElementById('audit-btn').innerText = "Run AI Audit";
                document.getElementById('audit-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                renderFields();
            } catch (e) {
                alert("Invalid JSON format in the input fields.");
            }
        }

        function renderFields() {
            const pdfContainer = document.getElementById('pdf-fields');
            const apiContainer = document.getElementById('api-fields');
            pdfContainer.innerHTML = '';
            apiContainer.innerHTML = '';

            Object.keys(currentAPI).forEach(key => {
                let statusClass = "bg-gray-800 border-gray-700 text-gray-200";
                let badgeHTML = "";

                if (auditComplete) {
                    const valPDF = currentPDF[key] || "";
                    const valAPI = currentAPI[key] || "";
                    
                    if (valAPI === "" && valPDF !== "") {
                        statusClass = "bg-orange-900/40 border-orange-500 text-white";
                        badgeHTML = `<span class="bg-orange-500 text-white text-[10px] font-bold px-2 py-1 rounded ml-2 uppercase tracking-wide">Missing Data</span>`;
                    } else if (valPDF === valAPI) {
                        statusClass = "bg-green-900/20 border-green-500/50 text-white";
                        badgeHTML = `<span class="bg-green-500 text-white text-[10px] font-bold px-2 py-1 rounded ml-2 uppercase tracking-wide">Verified</span>`;
                    } else if (key.includes("Turnover")) {
                        statusClass = "bg-red-900/40 border-red-500 text-white";
                        badgeHTML = `<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded ml-2 uppercase tracking-wide">Fatal Mismatch</span>`;
                    } else {
                        statusClass = "bg-yellow-900/30 border-yellow-500 text-white";
                        badgeHTML = `<span class="bg-yellow-500 text-black text-[10px] font-bold px-2 py-1 rounded ml-2 uppercase tracking-wide">Warning</span>`;
                    }
                }

                const createCard = (label, value) => `
                    <div class="border rounded p-3 transition-all duration-500 ${statusClass}">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs text-gray-400 font-bold uppercase">${label.replace(/_/g, ' ')}</span>
                            ${badgeHTML}
                        </div>
                        <div class="font-mono text-sm tracking-tight">${value || '<span class="text-orange-400 italic">No Record Found</span>'}</div>
                    </div>
                `;

                pdfContainer.innerHTML += createCard(key, currentPDF[key]);
                apiContainer.innerHTML += createCard(key, currentAPI[key]);
            });
        }

        function runAudit() {
            const btn = document.getElementById('audit-btn');
            btn.innerText = "Processing LLM...";
            btn.classList.add('opacity-50', 'cursor-not-allowed', 'animate-pulse');
            
            // Simulate AI processing delay for demo effect
            setTimeout(() => {
                auditComplete = true;
                btn.innerText = "Audit Complete";
                btn.classList.remove('animate-pulse');
                document.getElementById('summary-banner').classList.remove('hidden');
                renderFields();
            }, 1200);
        }

        function logDecision(decision) {
            alert(`✅ Decision Logged: Profile ${decision} by Procurement Officer.\nAudit trail securely saved to database.`);
        }
    </script>
</body>
</html>
